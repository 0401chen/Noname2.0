[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "replay-backend"
version = "0.3.0"
description = "Re:Play 青少年游戏行为心理支持原型后端"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "openai>=1.40,<2.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
replay-eval = "noname.evaluation:main"
replay-benchmark = "noname.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src/noname"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
