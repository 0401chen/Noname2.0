name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      SESSION_STORAGE: memory
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "backend[dev]"
      - name: Lint backend
        run: ruff check backend
      - name: Test backend
        run: pytest backend/tests -q
      - name: Run sixty deterministic conversation scenarios
        run: python -m noname.evaluation
      - name: Run transparent baseline benchmark
        run: python -m noname.benchmark
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-evaluation
          path: |
            evaluation/results/latest.json
            evaluation/results/benchmark.json
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t replay-backend:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t replay-frontend:ci .
